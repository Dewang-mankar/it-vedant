<h3>This is cart page..</h3>
<section class="cart">       
    <table>
        <thead>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </thead>
        <tbody>
            <tr>
            <td class="item">
                <img src="images/burger.jpg" alt="burger">
                <div>
                    <h4>Cheesy Burger</h4>
                    <p>Chessy Grilled Burger</p>
                </div>
            </td>
            <td>₹</td>
            <td>
                <div class="qty-box">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </td>
            <td>₹199</td>
            <td><button class="remove">X</button></td>
            </tr>
            <tr class="grand-total">
                <td colspan="3">Grand Total</td>
                <td>₹199</td>
                <td><button>Proceed</button></td>

            </tr>
        </tbody>
    </table>
</section>
